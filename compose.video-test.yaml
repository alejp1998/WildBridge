services:
  mediamtx:
    image: wildbridge-mediamtx:latest
    build:
      context: ./GroundStation/video_test/mediamtx
    container_name: wildbridge_mediamtx
    network_mode: host
    environment:
      - MTX_WEBRTCLOCALUDPADDRESS=${MEDIAMTX_WEBRTC_UDP_ADDRESS:-:8189}
    volumes:
      - ./GroundStation/video_test/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "-", "http://127.0.0.1:9997/v3/paths/list"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  video-grid:
    image: wildbridge-video-connection-test:latest
    build:
      # Rooted at GroundStation so the image can also carry the shared Python client the
      # MAVLink comparison panel reads both wires through.
      context: ./GroundStation
      dockerfile: video_test/webapp/Dockerfile
    container_name: wildbridge_video_connection_test
    network_mode: host
    depends_on:
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8090')+'/api/drones', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - PORT=${VIDEO_GRID_PORT:-8090}
      - MEDIAMTX_API_URL=${MEDIAMTX_API_URL:-http://127.0.0.1:9997}
      - MEDIAMTX_WEBRTC_URL=${MEDIAMTX_WEBRTC_URL:-http://127.0.0.1:8889}
      - DRONE_NAMES=${DRONE_NAMES:-}
      - DRONE_FALLBACKS=${DRONE_FALLBACKS:-}
      - DISCOVERY_INTERVAL_MS=${DISCOVERY_INTERVAL_MS:-5000}
      - TELEMETRY_PORT=${TELEMETRY_PORT:-8081}
      - LOG_DIR=/logs
      - PYTHONUNBUFFERED=1
    volumes:
      - ./GroundStation/video_test/logs:/logs

  ros-monitor:
    image: wildbridge-ros-monitor:latest
    build:
      context: .
      dockerfile: GroundStation/video_test/ros_monitor/Dockerfile
    container_name: wildbridge_ros_monitor
    network_mode: host
    depends_on:
      video-grid:
        condition: service_healthy
    healthcheck:
      # Healthy when the monitor is alive AND the webapp holds a fresh
      # per-drone report from it (monitor posts every 3 s; allow up to 25 s of
      # staleness, and require the monitor's report shape, not a foreign one).
      test: ["CMD", "python3", "-c", "import urllib.request,json,time,calendar; d=json.load(urllib.request.urlopen('http://127.0.0.1:8090/api/ros-status', timeout=5)); assert 'drones' in d and d.get('generatedAt'); t=time.strptime(d['generatedAt'], '%Y-%m-%dT%H:%M:%SZ'); assert time.time()-calendar.timegm(t) < 25"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - WEBAPP_URL=${WEBAPP_URL:-http://127.0.0.1:8090}
      - ROS_RUN_CONTROLLER=${ROS_RUN_CONTROLLER:-1}
      - ROS_DISCOVERY_PERIOD=${ROS_DISCOVERY_PERIOD:-15}
      - ROS_REPORT_INTERVAL=${ROS_REPORT_INTERVAL:-3}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
