[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wildbridge-groundstation"
version = "0.1.0"
description = "Shared Python client for the WildBridge drone ground station"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests"]

[project.scripts]
wildbridge-mavlink-listen = "wildbridge_groundstation.mavlink_listen:main"

[tool.setuptools]
# The loose modules keep their historical import paths (djiInterfaceSafety,
# wildbridge_dji_helpers) so existing callers and scripts keep working after
# a plain pip install, without PYTHONPATH tricks.
packages = ["wildbridge_groundstation"]
py-modules = ["djiInterfaceSafety", "wildbridge_dji_helpers"]
